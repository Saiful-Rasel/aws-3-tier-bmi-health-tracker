
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Learning infrastructure with a public GitHub Actions self-hosted runner
  and a private Docker application server with SSH and SSM access.

Parameters:
  AdminCidr:
    Type: String
    Description: Your current public IPv4 address with /32.

  AdminPublicKey:
    Type: String
    Description: SSH public key used for administrative and deployment access.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # --------------------------------------------------
  # 1. VPC and networking
  # --------------------------------------------------

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: bmi-learning-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: bmi-public-subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: bmi-private-subnet

  # Public subnet route table: internet through IGW.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # NAT Gateway allows private EC2 outbound internet access.
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: bmi-learning-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: bmi-learning-nat

  # Private subnet route table: outbound internet through NAT.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # --------------------------------------------------
  # 2. Security groups
  # --------------------------------------------------

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public self-hosted runner and Nginx reverse proxy.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Public browser traffic reaches Nginx.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        # Only your current public IP can SSH into the runner.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr

      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: bmi-runner-sg

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private app server accessible only through the runner.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Runner can SSH into the private app server for deployments.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref RunnerSecurityGroup

        # Runner Nginx can proxy browser traffic to the app.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref RunnerSecurityGroup

      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: bmi-app-sg

  # --------------------------------------------------
  # 3. Private application EC2 IAM role for SSM
  # --------------------------------------------------

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Allows SSM Agent to register and communicate with Systems Manager.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: bmi-app-ssm-role

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppRole

  # --------------------------------------------------
  # 4. Private application EC2
  # --------------------------------------------------

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AppInstanceProfile
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup

      # Require IMDSv2 for better instance metadata security.
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required

      Tags:
        - Key: Name
          Value: bmi-private-application

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf update -y
          dnf install -y docker curl unzip

          # Install and start Docker.
          systemctl enable --now docker
          usermod -aG docker ec2-user

          # Amazon Linux 2023 normally includes SSM Agent.
          # Enable it so the instance registers with Systems Manager.
          systemctl enable --now amazon-ssm-agent

          # Install Docker Compose v2 as a Docker CLI plugin.
          mkdir -p /usr/local/lib/docker/cli-plugins

          curl -fsSL \
            https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose

          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # Configure the public key for runner-to-app SSH deployment.
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh

          cat <<'EOF' > /home/ec2-user/.ssh/authorized_keys
          ${AdminPublicKey}
          EOF

          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys

          # Application deployment directory.
          mkdir -p /opt/bmi-app
          chown ec2-user:ec2-user /opt/bmi-app

  # --------------------------------------------------
  # 5. Public self-hosted GitHub Actions runner EC2
  # --------------------------------------------------

  RunnerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref RunnerSecurityGroup

      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required

      Tags:
        - Key: Name
          Value: bmi-self-hosted-runner

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf update -y
          dnf install -y nginx git curl jq tar gzip docker

          # Start Docker and Nginx automatically.
          systemctl enable --now docker
          systemctl enable --now nginx

          usermod -aG docker ec2-user

          # Remove the default Nginx server to avoid duplicate
          # default_server definitions on port 80.
          rm -f /etc/nginx/conf.d/default.conf

          # Reverse proxy: public runner -> private app EC2.
          cat <<'NGINX' > /etc/nginx/conf.d/bmi-proxy.conf
          server {
              listen 80 default_server;
              server_name _;

              location / {
                  proxy_pass http://${AppInstance.PrivateIp}:80;
                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_connect_timeout 10s;
                  proxy_read_timeout 60s;
                  proxy_send_timeout 60s;
              }
          }
          NGINX

          nginx -t
          systemctl restart nginx

          # Configure SSH access for runner administration.
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.ssh

          cat <<'EOF' > /home/ec2-user/.ssh/authorized_keys
          ${AdminPublicKey}
          EOF

          chown ec2-user:ec2-user /home/ec2-user/.ssh/authorized_keys
          chmod 600 /home/ec2-user/.ssh/authorized_keys

Outputs:

  VpcId:
    Description: VPC ID
    Value: !Ref VPC

  PublicSubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet

  PrivateSubnetId:
    Description: Private subnet ID
    Value: !Ref PrivateSubnet

  RunnerSecurityGroupId:
    Description: Public runner security group ID
    Value: !Ref RunnerSecurityGroup

  AppSecurityGroupId:
    Description: Private application security group ID
    Value: !Ref AppSecurityGroup

  RunnerInstanceId:
    Description: Public self-hosted runner EC2 instance ID
    Value: !Ref RunnerInstance

  RunnerPublicIP:
    Description: Public IP of the runner
    Value: !GetAtt RunnerInstance.PublicIp

  RunnerPrivateIP:
    Description: Private IP of the runner
    Value: !GetAtt RunnerInstance.PrivateIp

  AppInstanceId:
    Description: Private application EC2 instance ID
    Value: !Ref AppInstance

  AppPrivateIP:
    Description: Private IP of the application server
    Value: !GetAtt AppInstance.PrivateIp

  NatGatewayId:
    Description: NAT Gateway ID
    Value: !Ref NatGateway
