
name: 3-Tier Web App CI/CD to Private Server

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Prevent multiple deployments from running simultaneously.
concurrency:
  group: bmi-production-deploy
  cancel-in-progress: false

jobs:
  # ==========================================
  # CI: Continuous Integration
  # ==========================================
  ci:
    name: CI - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Run Tests
        working-directory: frontend
        run: npm test --if-present

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # Keep the production build for the deployment job.
      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # CD: Continuous Deployment
  # ==========================================
  deploy:
    name: CD - Deploy to Private Server
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Deploy to AWS Private Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIVATE_SERVER_IP }}
          username: ${{ secrets.PRIVATE_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "Connected to private server"

            # Install NGINX only if it is missing.
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            sudo systemctl enable --now nginx

            sudo mkdir -p /var/www/bmi-frontend
            sudo chown -R "$USER":"$USER" /var/www/bmi-frontend

      - name: Copy Build to Private Server
        run: |
          set -e

          # Copy the CI-generated frontend build to Server B.
          scp -r dist/. \
            "${{ secrets.PRIVATE_SERVER_USER }}@${{ secrets.PRIVATE_SERVER_IP }}:/tmp/bmi-frontend/"

          # Move files into the NGINX document root.
          ssh "${{ secrets.PRIVATE_SERVER_USER }}@${{ secrets.PRIVATE_SERVER_IP }}" \
            "sudo mkdir -p /var/www/bmi-frontend && \
             sudo cp -r /tmp/bmi-frontend/. /var/www/bmi-frontend/ && \
             sudo nginx -t && \
             sudo systemctl reload nginx"

      - name: Deployment Summary
        run: echo "Frontend deployment completed successfully."
